<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <rect width="512" height="512" rx="96" fill="#060606"/>
  <!-- web rings -->
  <circle cx="256" cy="256" r="160" fill="none" stroke="#c9a84c" stroke-width="0.8" opacity="0.15"/>
  <circle cx="256" cy="256" r="120" fill="none" stroke="#c9a84c" stroke-width="0.8" opacity="0.12"/>
  <circle cx="256" cy="256" r="80" fill="none" stroke="#c9a84c" stroke-width="0.8" opacity="0.10"/>
  <!-- spokes new (gold) -->
  <line x1="256" y1="256" x2="180" y2="96"  stroke="#c9a84c" stroke-width="2.5" opacity="0.7"/>
  <line x1="256" y1="256" x2="256" y2="90"  stroke="#c9a84c" stroke-width="2.5" opacity="0.7"/>
  <line x1="256" y1="256" x2="340" y2="96"  stroke="#c9a84c" stroke-width="2.5" opacity="0.7"/>
  <line x1="256" y1="256" x2="410" y2="200" stroke="#c9a84c" stroke-width="2"   opacity="0.6"/>
  <!-- spokes old (red) -->
  <line x1="256" y1="256" x2="130" y2="340" stroke="#cc4444" stroke-width="2"   opacity="0.6"/>
  <line x1="256" y1="256" x2="220" y2="420" stroke="#cc4444" stroke-width="2.5" opacity="0.7"/>
  <line x1="256" y1="256" x2="300" y2="420" stroke="#cc4444" stroke-width="2"   opacity="0.6"/>
  <!-- center glow -->
  <circle cx="256" cy="256" r="22" fill="#c9a84c" opacity="0.15"/>
  <circle cx="256" cy="256" r="14" fill="#c9a84c" opacity="0.5"/>
  <circle cx="256" cy="256" r="8"  fill="#f0d080"/>
</svg>
